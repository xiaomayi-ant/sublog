<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img"><rect width="1400" height="650" fill="#f7fafc"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="700" y="70" text-anchor="middle" font-size="34" font-weight="700" fill="#1d5e78">Hermes：稳定上下文与学习闭环</text><path d="M350 285H515M865 285H1030" stroke="#5f9eb7" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5f9eb7"/></marker></defs><rect x="80" y="175" width="270" height="220" rx="18" fill="#e5f3f8" stroke="#5f9eb7" stroke-width="3"/><text x="215" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#1d5e78">稳定提示词</text><text x="215" y="270" text-anchor="middle" font-size="18" fill="#315568">身份、工具规则</text><text x="215" y="300" text-anchor="middle" font-size="18" fill="#315568">技能、项目指令</text><text x="215" y="345" text-anchor="middle" font-size="16" fill="#527083">会话内复用，保持缓存前缀</text><rect x="515" y="150" width="350" height="270" rx="24" fill="#173d57"/><text x="690" y="215" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">智能体回合</text><text x="690" y="260" text-anchor="middle" font-size="19" fill="#dbeaf1">任务理解 → 工具调用 → 回答</text><text x="690" y="305" text-anchor="middle" font-size="19" fill="#dbeaf1">压缩时重建上下文</text><text x="690" y="350" text-anchor="middle" font-size="16" fill="#bad5e3">会话、成本、可靠性共同管理</text><rect x="1030" y="175" width="290" height="220" rx="18" fill="#e5f3f8" stroke="#5f9eb7" stroke-width="3"/><text x="1175" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#1d5e78">记忆与执行</text><text x="1175" y="270" text-anchor="middle" font-size="18" fill="#315568">跨会话召回</text><text x="1175" y="300" text-anchor="middle" font-size="18" fill="#315568">代码与工具执行</text><text x="1175" y="345" text-anchor="middle" font-size="16" fill="#527083">复盘形成记忆或技能</text><path d="M1175 395 C1175 560 310 560 215 395" fill="none" stroke="#5f9eb7" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#a)"/><text x="700" y="555" text-anchor="middle" font-size="20" font-weight="700" fill="#1d5e78">核心取舍：用稳定上下文换取缓存效率，再用记忆与复盘补充适应能力</text></g></svg>
