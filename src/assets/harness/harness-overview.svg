<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">四种智能体 Harness 架构总览</title><desc id="desc">Hermes、OpenCode、Pi 和 DeepSeek Harness 从四个角汇聚到稳健智能体运行框架。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#678196"/></marker></defs>
  <rect width="1400" height="900" fill="#f7fafc"/>
  <text x="700" y="76" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#183247">四种开源智能体 Harness 范式</text>
  <text x="700" y="116" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#526b7c">四条互补路径，共同指向可控、可演化的智能体运行框架</text>
  <line x1="418" y1="285" x2="605" y2="405" stroke="#678196" stroke-width="4" marker-end="url(#arrow)"/><line x1="982" y1="285" x2="795" y2="405" stroke="#678196" stroke-width="4" marker-end="url(#arrow)"/><line x1="418" y1="630" x2="605" y2="505" stroke="#678196" stroke-width="4" marker-end="url(#arrow)"/><line x1="982" y1="630" x2="795" y2="505" stroke="#678196" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect x="90" y="170" width="360" height="180" rx="20" fill="#e5f3f8" stroke="#5f9eb7" stroke-width="3"/><text x="120" y="218" font-size="28" font-weight="700" fill="#1d5e78">Hermes Agent</text><text x="120" y="258" font-size="19" fill="#315568">稳定上下文与缓存</text><text x="120" y="290" font-size="19" fill="#315568">记忆召回与学习闭环</text><text x="120" y="322" font-size="19" fill="#315568">可替换执行后端</text>
  <rect x="950" y="170" width="360" height="180" rx="20" fill="#eeeafd" stroke="#8176bd" stroke-width="3"/><text x="980" y="218" font-size="28" font-weight="700" fill="#4f4786">OpenCode</text><text x="980" y="258" font-size="19" fill="#554f78">Effect 类型化运行时</text><text x="980" y="290" font-size="19" fill="#554f78">依赖、错误与取消</text><text x="980" y="322" font-size="19" fill="#554f78">资源生命周期管理</text>
  <rect x="90" y="555" width="360" height="180" rx="20" fill="#fff0df" stroke="#bf8551" stroke-width="3"/><text x="120" y="603" font-size="28" font-weight="700" fill="#89552a">Pi</text><text x="120" y="643" font-size="19" fill="#74563d">最小工具内核</text><text x="120" y="675" font-size="19" fill="#74563d">前后钩子可干预</text><text x="120" y="707" font-size="19" fill="#74563d">策略与核心分离</text>
  <rect x="950" y="555" width="360" height="180" rx="20" fill="#e8f5ea" stroke="#66956d" stroke-width="3"/><text x="980" y="603" font-size="26" font-weight="700" fill="#3e7046">DeepSeek Harness</text><text x="980" y="643" font-size="19" fill="#426047">一切皆插件</text><text x="980" y="675" font-size="19" fill="#426047">Fiber 生命周期所有权</text><text x="980" y="707" font-size="19" fill="#426047">组合树管理复杂度</text>
  <circle cx="700" cy="455" r="172" fill="#173d57"/><text x="700" y="421" text-anchor="middle" font-size="30" font-weight="700" fill="#fff" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">稳健的</text><text x="700" y="462" text-anchor="middle" font-size="30" font-weight="700" fill="#fff" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">智能体 Harness</text><text x="700" y="502" text-anchor="middle" font-size="17" fill="#dbeaf1" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">清晰边界 · 可观察所有权 · 安全变更</text></g>
</svg>
