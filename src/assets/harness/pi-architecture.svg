<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img"><rect width="1400" height="650" fill="#fffaf5"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bf8551"/></marker></defs><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="700" y="70" text-anchor="middle" font-size="34" font-weight="700" fill="#89552a">Pi：最小内核与可编程边界</text><rect x="85" y="185" width="330" height="220" rx="18" fill="#fff0df" stroke="#bf8551" stroke-width="3"/><text x="250" y="240" text-anchor="middle" font-size="26" font-weight="700" fill="#89552a">最小工具内核</text><text x="250" y="285" text-anchor="middle" font-size="18" fill="#74563d">默认：read · write</text><text x="250" y="317" text-anchor="middle" font-size="18" fill="#74563d">edit · bash</text><text x="250" y="360" text-anchor="middle" font-size="16" fill="#8a6a50">观察、修改、执行</text><rect x="545" y="150" width="310" height="290" rx="25" fill="#89552a"/><text x="700" y="215" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">扩展干预边界</text><text x="700" y="263" text-anchor="middle" font-size="18" fill="#fff1e6">执行前：改参或阻止</text><text x="700" y="305" text-anchor="middle" font-size="18" fill="#fff1e6">执行后：改写结果</text><text x="700" y="347" text-anchor="middle" font-size="18" fill="#fff1e6">工具、命令、界面、策略</text><text x="700" y="392" text-anchor="middle" font-size="15" fill="#fde1c9">可按工作流替换</text><rect x="985" y="185" width="330" height="220" rx="18" fill="#fff0df" stroke="#bf8551" stroke-width="3"/><text x="1150" y="240" text-anchor="middle" font-size="26" font-weight="700" fill="#89552a">安全与状态</text><text x="1150" y="285" text-anchor="middle" font-size="18" fill="#74563d">项目扩展先建立信任</text><text x="1150" y="317" text-anchor="middle" font-size="18" fill="#74563d">会话树与上下文压缩</text><text x="1150" y="360" text-anchor="middle" font-size="16" fill="#8a6a50">同文件写入顺序化</text><path d="M415 295H535M865 295H975" stroke="#bf8551" stroke-width="5" marker-end="url(#a)"/><text x="700" y="545" text-anchor="middle" font-size="20" font-weight="700" fill="#89552a">核心取舍：核心保持少而稳定，把复杂工作流交给可审查的扩展</text></g></svg>
