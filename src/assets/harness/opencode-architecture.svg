<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img"><rect width="1400" height="650" fill="#faf9ff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8176bd"/></marker></defs><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="700" y="70" text-anchor="middle" font-size="34" font-weight="700" fill="#4f4786">OpenCode：类型化运行时</text><rect x="105" y="175" width="300" height="240" rx="18" fill="#eeeafd" stroke="#8176bd" stroke-width="3"/><text x="255" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#4f4786">应用边界</text><text x="255" y="275" text-anchor="middle" font-size="18" fill="#554f78">命令行 · HTTP · 兼容层</text><text x="255" y="320" text-anchor="middle" font-size="16" fill="#766f96">把 Effect 转为 Promise</text><rect x="550" y="145" width="300" height="300" rx="25" fill="#4f4786"/><text x="700" y="215" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">Effect 运行时</text><text x="700" y="260" text-anchor="middle" font-size="18" fill="#eceaff">成功值 · 预期错误</text><text x="700" y="295" text-anchor="middle" font-size="18" fill="#eceaff">依赖服务 · 取消</text><text x="700" y="330" text-anchor="middle" font-size="18" fill="#eceaff">追踪 · 资源作用域</text><text x="700" y="380" text-anchor="middle" font-size="15" fill="#d3cef2">统一组装并运行</text><rect x="995" y="175" width="300" height="240" rx="18" fill="#eeeafd" stroke="#8176bd" stroke-width="3"/><text x="1145" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#4f4786">领域服务</text><text x="1145" y="275" text-anchor="middle" font-size="18" fill="#554f78">会话 · 权限 · 存储</text><text x="1145" y="310" text-anchor="middle" font-size="18" fill="#554f78">工具 · 模型 · 文件</text><text x="1145" y="350" text-anchor="middle" font-size="16" fill="#766f96">服务显式声明依赖</text><path d="M405 295H540M860 295H985" stroke="#8176bd" stroke-width="5" marker-end="url(#a)"/><text x="700" y="545" text-anchor="middle" font-size="20" font-weight="700" fill="#4f4786">核心取舍：以更强的类型与运行时纪律，换取大型智能体系统的可控性</text></g></svg>
