<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img"><rect width="1400" height="650" fill="#f7fcf7"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#66956d"/></marker></defs><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="700" y="70" text-anchor="middle" font-size="34" font-weight="700" fill="#3e7046">DeepSeek Harness：以插件组合系统</text><rect x="70" y="175" width="310" height="235" rx="18" fill="#e8f5ea" stroke="#66956d" stroke-width="3"/><text x="225" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#3e7046">Loader 组合树</text><text x="225" y="275" text-anchor="middle" font-size="18" fill="#426047">基础 bundle</text><text x="225" y="307" text-anchor="middle" font-size="18" fill="#426047">模式 bundle 与 profile</text><text x="225" y="350" text-anchor="middle" font-size="16" fill="#5c7861">创建、更新、禁用、删除</text><rect x="545" y="145" width="310" height="300" rx="25" fill="#3e7046"/><text x="700" y="210" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">Cordis + Fiber</text><text x="700" y="258" text-anchor="middle" font-size="18" fill="#e7f5e9">函数 · 类 · apply 对象</text><text x="700" y="300" text-anchor="middle" font-size="18" fill="#e7f5e9">依赖注入与服务作用域</text><text x="700" y="342" text-anchor="middle" font-size="18" fill="#e7f5e9">注册即拥有生命周期</text><text x="700" y="390" text-anchor="middle" font-size="15" fill="#c9e4cd">释放 Fiber 时清理已托管资源</text><rect x="1020" y="175" width="310" height="235" rx="18" fill="#e8f5ea" stroke="#66956d" stroke-width="3"/><text x="1175" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#3e7046">能力插件</text><text x="1175" y="275" text-anchor="middle" font-size="18" fill="#426047">会话 · 模型 · 工具</text><text x="1175" y="307" text-anchor="middle" font-size="18" fill="#426047">权限 · 沙箱 · 工作流</text><text x="1175" y="350" text-anchor="middle" font-size="16" fill="#5c7861">遥测与子智能体</text><path d="M380 295H535M865 295H1010" stroke="#66956d" stroke-width="5" marker-end="url(#a)"/><text x="700" y="545" text-anchor="middle" font-size="20" font-weight="700" fill="#3e7046">核心取舍：可逆生命周期降低残留风险，但组合规模仍需要架构治理</text></g></svg>
