[policy]
inherits = "global-2026-07-25"

[commands]
test = "npm test"
contract = "npm run test:contract"
mutation_changed = "npm run test:mutation"

[boundaries]
integration = ["src/pages/**", "src/content.config.ts", "src/lib/content.ts"]

[effects]
production_write = ["scripts/deploy-site.mjs", "scripts/server/bootstrap-water.sh", "scripts/server/remote-release.sh"]
credentials = []

[budgets]
mutation_seconds = 120
