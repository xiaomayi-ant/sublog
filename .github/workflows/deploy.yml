name: Deploy

# push 到 main 即构建并发布。手动触发保留给回滚后的重新发布。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署在跑。服务器侧还有 .deploy-lock，这里是第一道闸。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 构建与测试约 2 分钟，末尾的 verify 最多等 15 分钟，留出余量。
    # 这个值必须大于 verify 的窗口，否则 job 会先被杀掉，
    # 表现成和"线上没切换"一模一样的红色，但原因完全不同。
    timeout-minutes: 25
    # 只需要建 Release。不需要、也拿不到任何生产机凭据。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 用 24 而不是 engines 里的下限 22.12：package-lock.json 是 npm 11 生成的，
      # 而 22.12 自带 npm 10，两者对 @emnapi 那条 alpha 传递依赖的解析不一致，
      # npm ci 会直接判定锁文件不同步。24 自带 npm 11，与本地开发环境同一大版本。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 这里用 install 而不是 ci：package-lock.json 在 macOS 上生成，
      # @emnapi/wasi-threads 那条链在 darwin 是 optional 被跳过、依赖没进锁文件，
      # 到 Linux 上却是必需的，npm ci 因此判定锁文件不同步（两个 Node 大版本都一样）。
      # 代价是每次跑会重新解析依赖，换来的是构建能进行；紧接着的 npm test 是真正的闸门。
      # 想恢复 npm ci 的严格性，需要在 Linux 上重新生成一次锁文件。
      - run: npm install --no-audit --no-fund

      # 与本地 deploy-site.mjs 一致：先用 water.localhost 跑完整 gate，
      # 再用真实域名构建一次，免得把测试用的 origin 烤进 canonical 和 RSS。
      - name: Verify
        run: npm test
        env:
          SITE_URL: https://water.localhost

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      # release id 与本地部署同构：v<版本>-<UTC 时间戳>-<短 sha>
      - name: Stamp release
        id: rel
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -eu
          export RELEASE="v$(node -p "require('./package.json').version")-$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short=7 HEAD)"
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync("dist/release.json", JSON.stringify({
              releaseId: process.env.RELEASE,
              commit: process.env.GITHUB_SHA.slice(0, 7),
              siteUrl: process.env.SITE_URL,
              builtAt: new Date().toISOString(),
            }, null, 2) + "\n");
          '
          echo "id=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          RELEASE: ${{ steps.rel.outputs.id }}
        run: tar czf "site.tar.gz" -C dist .

      # 发布产物，等服务器自己来取。CI 不持有任何进入生产机的凭据 ——
      # 阿里云安全组只放行固定来源 IP，runner 连不进来，方向必须反过来。
      # 资产名固定为 site.tar.gz，服务器上的轮询脚本按这个名字找。
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.rel.outputs.id }}
        run: |
          set -eu
          gh release create "$RELEASE" site.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE" \
            --notes "Automated build of ${GITHUB_SHA}. The production host polls for this and promotes it."

      # 产物发布 ≠ 线上生效。生产机的 water-pull.timer 每 2 分钟轮询一次 Release，
      # 拉下来校验后原子切换 —— 而那个脚本的每一条失败路径（api-unreachable /
      # download-failed / stamp-mismatch / invalid-tag）都只写服务器上的 deploy.log，
      # 外部没有任何信号。不在这里核对的话，绿色的 workflow 只证明"包发出去了"，
      # 不证明"线上跑的是这个 commit"，而后者才是我们真正想要的保证。
      #
      # 核对手段是构建期就烤进产物的 dist/release.json：它带着 releaseId，
      # 且轮询脚本已经校验过 tag 与它一致，所以线上读到什么就是线上在跑什么。
      - name: Verify the live site serves this release
        env:
          RELEASE: ${{ steps.rel.outputs.id }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -eu
          # 窗口 15 分钟，不是 6 分钟。实测「发布 → 线上切换」的耗时方差很大：
          # 1.5 / 2 / 3 / 8.6 分钟都出现过 —— 阿里云到 GitHub 这条路大约 30KB/s，
          # 400KB 的产物单次要十几秒，且经常整次失败，靠 2 分钟一轮的重试熬过去。
          # 6 分钟正好卡在方差中间，会把成功的部署报成红色；假红比不报警更糟，
          # 因为它会让人开始无视这个信号。
          live=''
          for attempt in $(seq 1 90); do
            live=$(curl -sf --max-time 10 "$SITE_URL/release.json" | jq -r '.releaseId // empty' || true)
            if [ "$live" = "$RELEASE" ]; then
              echo "线上已切换到 $RELEASE（第 $attempt 次探测，约 $((attempt * 10)) 秒）"
              exit 0
            fi
            sleep 10
          done
          echo "::error::线上 15 分钟内没有切换到 $RELEASE（当前 ${live:-无法读取}）"
          echo "排查顺序：/srv/water/deploy.log → systemctl status water-pull.service → /srv/water/DEPLOY_DISABLED 是否存在"
          exit 1
