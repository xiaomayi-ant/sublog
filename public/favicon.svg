<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Water</title>
  <!-- 三道水纹：站点主视觉是首页那条河，这里取它最简的形态。
       颜色取自 tokens 的 water-300 (#84dcd9)，深浅两种标签栏底色下都验证过可读，
       所以不做 prefers-color-scheme 切换，少一个会漂的地方。
       笔画 3.4 是在 16px 下试出来的，再细就发虚。
       注意：XML 注释里写不得两个连续的连字符，写 CSS 变量名会直接让 SVG 解析失败。
       width/height 也不能省 —— 只有 viewBox 的话没有内在尺寸，当 img 加载会失败。 -->
  <g fill="none" stroke="#84dcd9" stroke-width="3.4" stroke-linecap="round">
    <path d="M5 10.5q5.5-3.5 11 0t11 0"/>
    <path d="M5 16q5.5-3.5 11 0t11 0"/>
    <path d="M5 21.5q5.5-3.5 11 0t11 0"/>
  </g>
</svg>
